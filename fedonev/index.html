<style>

    <div class="err" id="err"></div>
  </form>

  <div id="out">
    <img id="cardImg" alt="Fedőnév-karton">
    <div class="method" id="method"></div>
    <p class="pickhead">Nem tetszik? Válassz egyet, amíg még lehet:</p>
    <div class="chips" id="chips"></div>
    <label class="ownlbl" for="own">Saját nevet választok</label>

</div>
<div class="sharebar" id="sharebar"><button type="button" id="share">Megosztás</button><div class="smsg" id="copyMsg"></div></div>

function truncName(surname){
  const s=norm(surname).replace(/[^a-záéíóöőúüű]/g,'');
  if(!s) return null;
  const V='aáeéiíoóöőuúüű';
  let i=0; while(i<s.length && !V.includes(s[i])) i++;
  if(i>=s.length) return cap(s)+'a';
  let j=i+1;
  const tri=['dzs'],di=['cs','dz','gy','ly','ny','sz','ty','zs'];
  if(j>=s.length) return cap(s)+'ka';
  if(V.includes(s[j])) return cap(s.slice(0,j+1))+'ka';
  if(tri.includes(s.slice(j,j+3))) j+=3; else if(di.includes(s.slice(j,j+2))) j+=2; else j+=1;
  let base=s.slice(0,j);
  if(base===s) return cap(base)+'a';
  return cap(base+'a');
}

function strategies(d,r){
  const fun=[], dumb=[];
  const job=norm(d.job), hob=norm(d.hobby);
  const surRaw=(d.name.trim().split(/\s+/)[0]||''), sur=norm(surRaw);
  if(job){
    const hit=JOBS.find(([re])=>re.test(job));
    if(hit){
      for(const [n,w] of hit[3]) fun.push({key:'roast',name:n,label:'LIGHTOS ALÁZÁS',why:w});
      for(const [n,w] of hit[2]) fun.push({key:'assoc',name:n,label:'ERŐLTETETT SZELLEMESKEDÉS',why:w});
      dumb.push({key:'fafej',name:pick(hit[1],r),label:'FAFEJŰ',why:`Foglalkozása: ${d.job.trim()}. A tartótiszt aznap korán akart hazamenni.`});
    } else {
      dumb.push({key:'fafej',name:cap(job.split(/\s+/).pop()),label:'FAFEJŰ',why:`Megkérdezték, mi a foglalkozása. Ennyi volt az ötletelés.`});
      fun.push({key:'roast',name:'Valami Irodai',label:'LIGHTOS ALÁZÁS',why:'Senki nem tudta pontosan, mivel foglalkozik. Ő sem.'});
    }
  }
  if(SURNAMES[sur]) fun.push({key:'assoc',name:SURNAMES[sur],label:'ERŐLTETETT SZELLEMESKEDÉS',why:`A vezetékneve ${cap(sur)}. A tartótiszt egész délután ezen röhögött.`});
  if(hob){
    const hit=HOBBIES.find(([re])=>re.test(hob));
    if(hit){
      fun.push({key:'roast',name:hit[2][0],label:'LIGHTOS ALÁZÁS',why:hit[2][1]});
      dumb.push({key:'fafej',name:hit[1],label:'FAFEJŰ',why:`Szabadidejében: ${d.hobby.trim()}. A környezettanulmány itt véget is ért.`});
    }
  }
  const t=truncName(surRaw);
  if(t) dumb.push({key:'fafej',name:t,label:'FAFEJŰ',why:'Levágták a vezetékneve végét, és odabiggyesztettek egy magánhangzót. Ennyi telt.'});
  if(d.town.trim()){
    let tw=cap(d.town.trim().split(/[\s,]/)[0]); if(!/i$/.test(tw)) tw+='i';
    dumb.push({key:'fafej',name:tw,label:'FAFEJŰ',why:'Megkérdezték, honnan való. Utána már nem kérdeztek semmit.'});
  }
  // a vicces változatok jönnek előbb, seedelt sorrendben
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const list=shuffle(fun).concat(shuffle(dumb));
  list.forEach(x=>x.prec=PREC[x.key]);
  return list;
}

function wrap(ctx,text,x,y,maxW,lh){
  const words=text.split(' ');let line='';let yy=y;
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh}else line=test}
  if(line){ctx.fillText(line,x,yy);yy+=lh}
  return yy;
}

  {const fs=26,sp=fs*0.16,parts=[['You lucky ','900 '],['bastard.','italic 900 ']];
   const ff=fs+'px "Playfair Display",Georgia,serif';let w=0;
   for(const [t,st] of parts){ctx.font=st+ff;for(const ch of t)w+=ctx.measureText(ch).width+sp}
   w-=sp;let x=R-w;const yy=H-80;ctx.fillStyle='#1A1A18';ctx.textAlign='left';
   for(const [t,st] of parts){ctx.font=st+ff;for(const ch of t){ctx.fillText(ch,x,yy);x+=ctx.measureText(ch).width+sp}}}
  ctx.restore();

  $('cardImg').src=c.toDataURL('image/png');
  $('method').innerHTML='<b>Valódi precedens:</b> '+st.prec;
  $('chips').innerHTML=s.list.map((x,i)=>'<button type="button" data-i="'+i+'" class="'+(i===s.idx?'on':'')+'">„'+x.name+'”</button>').join('');

  $('copyMsg').textContent='';
}

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const d={name:$('name').value,job:$('job').value,hobby:$('hobby').value,town:$('town').value,habit:$('habit').value};
  if(d.name.trim().split(/\s+/).length<2){$('err').textContent='Teljes nevet kérünk, elvtárs.';return}
  if(!$('self').checked){$('err').textContent='Csak saját magadat szervezheted be. Pipáld be a négyzetet.';return}
  $('err').textContent='';
  try{await Promise.all([document.fonts.load('52px "Special Elite"'),document.fonts.load('26px "Courier Prime"'),document.fonts.load('bold 26px "Courier Prime"'),document.fonts.load('900 26px "Playfair Display"'),document.fonts.load('italic 900 26px "Playfair Display"')])}catch(_){}
  const seed=hash(norm(d.name)+'|'+norm(d.job));
  const r=rng(seed);
  const list=strategies(d,r);
  state={d,seed,list,idx:0};
  draw();
  $('out').style.display='block';$('sharebar').style.display='block';
  $('out').scrollIntoView({behavior:'smooth'});
});

const OWN_WHY=['Hozott fedőnévvel érkezett. Gyanúsan felkészült.','Ragaszkodott hozzá. A tartótiszt nem vitatkozott.','Saját maga találta ki. A tartótiszt csak felírta.'];
function applyOwn(){
  if(!state)return;
  const v=$('own').value.trim().replace(/\s+/g,' ').slice(0,20);
  if(!v){$('own').focus();return}
  const nm=v.split(' ').map(cap).join(' ');
  state.list=state.list.filter(x=>x.key!=='own');
  state.list.unshift({key:'own',name:nm,label:'SAJÁT VÁLASZTÁS',why:OWN_WHY[hash(norm(nm))%OWN_WHY.length],prec:PREC.own});
  state.idx=0;draw();$('own').blur();
  window.scrollTo({top:0,behavior:'smooth'});
}
$('ownBtn').addEventListener('click',applyOwn);
$('own').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyOwn()}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!state)return;state.idx=+b.dataset.i;draw()});
$('share').addEventListener('click',async()=>{
  if(!state)return;
  const msg=$('copyMsg');msg.textContent='';
  const blob=await new Promise(res=>$('c').toBlob(res,'image/png'));
  const fn='fedonev-'+norm(state.list[state.idx].name).replace(/[^a-z0-9áéíóöőúüű]+/g,'-')+'.png';
  // 1) natív megosztás (saját domainen, mobilon)
  try{
    const file=new File([blob],fn,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text:shareText()+' '+shareUrl()});return;
    }
  }catch(err){if(err&&err.name==='AbortError')return}
  // 2) Claude app (artifact-nézet)
  const dl=await getDl();
  if(dl){try{await dl.save({filename:fn,data:blob});return}catch(err){if(err&&err.code==='declined')return}}
  msg.textContent='Itt nem nyílik meg a megosztás. Nyomd hosszan a képet, és mentsd el.';
});

(function(){
 const cv=$('pix');if(!cv)return;const c=cv.getContext('2d'),U=10;
 const px=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x*U),Math.round(y*U),Math.round(w*U),Math.round(h*U))};
 const names=['QUIZ','NANU-NANU','DÉVA','TANÁR','?'];let i=0,drop=0,sigh=0,tear=null,t0=performance.now();
 const rain=[];for(let k=0;k<16;k++)rain.push({x:Math.random()*20,y:Math.random()*30,s:.22+Math.random()*.2});
 const COAT='#a8946a',COATD='#8a7650',COATL='#bba67a',HAT='#1a1816';
 function frame(t){
  c.clearRect(0,0,200,300);
  rain.forEach(r=>{px(r.x,r.y,0.2,1,'#56636f');r.y+=r.s;if(r.y>30){r.y=-1;r.x=Math.random()*20}});
  const sg=Math.sin((t-t0)/900)*0.15+sigh, d=drop;
  // lábak, cipők
  px(6.5,24,2.5,4,'#26231f');px(11,24,2.5,4,'#26231f');px(5.5,28,3.5,1,'#111');px(11,28,3.5,1,'#111');
  // kabát (lógó, csapott váll)
  px(6,12+sg,8,12,COAT);px(5,13+sg,1,11,COAT);px(14,13+sg,1,11,COAT);px(4.5,14+sg,0.5,8,COATD);px(15,14+sg,0.5,8,COATD);
  px(4,22,12,2,COAT);px(9.6,12+sg,0.8,12,COATD);px(5,18.5+sg,10,0.8,COATD);
  // karok lógva
  px(3.5,14+sg,1.5,6,'#9a875f');px(15,14+sg,1.5,6,'#9a875f');
  // fej: mélyen lehajtva, kicsit oldalra billentve
  const hy=2.2+sg+d, hx=0.4;
  const fx=7+hx, fy=8+hy;
  px(fx,fy,6,2.8,'#c9a27e');px(fx,fy,6,0.7,'#8f6f52');px(fx,fy+2.4,6,0.4,'#a8865f');
  px(fx+1.1,fy+0.9,0.8,0.25,'#3a2a1e');px(fx+1.6,fy+0.75,0.5,0.25,'#3a2a1e');
  px(fx+4.1,fy+0.9,0.8,0.25,'#3a2a1e');px(fx+3.9,fy+0.75,0.5,0.25,'#3a2a1e');
  px(fx+1.3,fy+1.3,0.6,0.6,'#1a1816');px(fx+4.1,fy+1.3,0.6,0.6,'#1a1816');
  px(fx+2.3,fy+2.15,1.4,0.25,'#5a3a2a');px(fx+2.0,fy+2.35,0.35,0.25,'#5a3a2a');px(fx+3.65,fy+2.35,0.35,0.25,'#5a3a2a');
  px(6+hx,3+hy,8,3,HAT);px(6+hx,6+hy,8,0.8,'#b3261e');px(3.8+hx,6.8+hy,13,1,HAT);
  // felállított gallér az arc két oldalán
  px(5.2,10+sg,1.8,3.5,COATL);px(5.8,9.2+sg,1.2,1,COATL);px(6.6,10.4+sg,0.5,3,COATD);
  px(13.2,10+sg,1.8,3.5,COATL);px(13.2,9.2+sg,1.2,1,COATL);px(13,10.4+sg,0.5,3,COATD);
  // tábla
  px(3,17+sg,14,5,'#efe6d2');c.strokeStyle='#b3261e';c.lineWidth=3;c.strokeRect(31.5,171.5+sg*U,137,47);
  px(3,17+sg,1,1.2,'#c9a27e');px(16,17+sg,1,1.2,'#c9a27e');
  // könnycsepp
  if(!tear&&Math.random()<0.008)tear={x:Math.random()<.5?fx+1.45:fx+4.25,y:fy+1.9};
  if(tear){px(tear.x,tear.y,0.35,0.5,'#8fb3d9');tear.y+=0.05;if(tear.y>fy+3.2)tear=null}
  requestAnimationFrame(frame);
 }
 const tag=$('tag');
 function next(){
  const n=names[i];tag.textContent=n;const fh=cv.clientHeight||300;tag.style.fontSize=Math.round(fh*(n.length>6?0.037:0.05))+'px';
  tag.style.color=n==='?'?'#b3261e':'#1d1b18';
  drop=0.9;tag.style.transform='translateY(4px) rotate(-2deg)';
  if(n==='?')sigh=0.6;
  setTimeout(()=>{drop=0;sigh=0;tag.style.transform='rotate(-1deg)'},n==='?'?1800:550);
  i=(i+1)%names.length;setTimeout(next,n==='?'?3400:2300);
 }
 next();requestAnimationFrame(frame);
 $('cta').addEventListener('click',()=>{$('f').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('name').focus(),500)});
})();
})();
</script>
